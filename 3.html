<!doctype html>

<body>
  <div class="app" id="app">
    <header class="topbar" aria-label="프레젠테이션 상단 내비게이션">
      <a class="brand" href="#slide=1" id="brandLink" aria-label="첫 슬라이드로">

      <div class="top-center"><span class="live-dot"></span><span id="sectionLabel">INTRO</span><span class="separator">/</span><span id="slideName">정책 개요</span></div>
      <div class="top-actions">
        <button class="icon-button" id="overviewBtn" aria-label="전체 슬라이드 보기" title="전체 슬라이드 보기 (G)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>

        </button>
        <button class="icon-button" id="fullscreenBtn" aria-label="전체 화면" title="전체 화면 (F)">

        </button>
      </div>
    </header>

    <main id="presentation" class="presentation" aria-label="정책 프레젠테이션">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
      <div class="stage-wrap">
        <div class="slide-frame" id="slideFrame" tabindex="0" aria-label="슬라이드 화면. 방향키 또는 화면 스와이프로 이동">

            <img class="slide-image is-current" src="assets/slide-01.webp" alt="슬라이드 1: 천안시 고속도로 통행료 지원정책 표지" draggable="false" fetchpriority="high" />
          </div>
          <span class="corner-accent" aria-hidden="true"></span>
        </div>
      </div>
      <div class="side-label" aria-hidden="true">CHEONAN MOBILITY · 2026</div>
    </main>

    <footer class="bottombar" aria-label="슬라이드 이동 컨트롤">
      <div class="footer-status"><span class="count-current" id="currentNumber">01</span><span class="count-divider">/</span><span class="count-total">10</span><span class="status-text">정책 검토용 · 2026.11.18</span></div>
      <div class="timeline" role="group" aria-label="슬라이드 바로 이동" id="timeline"></div>

    </footer>
  </div>

  <div class="modal" id="overviewModal" role="dialog" aria-modal="true" aria-labelledby="overviewTitle" aria-hidden="true">
    <div class="modal-backdrop" data-dismiss="overview"></div>
    <div class="modal-shell overview-shell">
      <div class="modal-heading"><div><span class="eyebrow">SLIDE OVERVIEW</span><h2 id="overviewTitle">전체 슬라이드</h2><p>원하는 슬라이드를 선택하세요.</p></div><button class="close-button" data-dismiss="overview" aria-label="닫기">×</button></div>

    </div>
  </div>

  <div class="modal" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoTitle" aria-hidden="true">
    <div class="modal-backdrop" data-dismiss="info"></div>
    <div class="modal-shell info-shell">
      <div class="modal-heading"><div><span class="eyebrow">PRESENTER NOTES</span><h2 id="infoTitle">슬라이드 정보</h2><p id="infoSubtitle"></p></div><button class="close-button" data-dismiss="info" aria-label="닫기">×</button></div>
      <div class="info-body"><div class="info-label">핵심 내용</div><p id="infoSummary"></p><div class="info-label">출처 / 유의사항</div><div id="infoSources" class="source-list"></div><p class="info-notice">이 발표자료는 정책 검토용입니다. 전액 지원과 적용 시간 등 제안 조건은 시행 확정 내용이 아닙니다.</p></div>
    </div>

  <div class="sr-only" aria-live="polite" aria-atomic="true" id="announcer"></div>
